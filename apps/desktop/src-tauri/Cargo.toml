[package]
name = "gento-tauri"
description = "GEN-TO spike desktop shell (thin Tauri adapter)"
version.workspace = true
edition.workspace = true

[lib]
name = "gento_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
gento-core = { workspace = true }
gento-db = { workspace = true }
gento-image = { workspace = true }
# OS差の土台 (ゴミ箱・OSファイルID。WP-7)
gento-platform = { workspace = true }
gento-search = { workspace = true }
# AI統合 (OpenAI互換クライアント・パイプライン。WP-10)
gento-ai = { workspace = true }
# ローカル埋め込み (ruri-v3 ONNX・ワーカー管理。WP-11)
gento-embedding = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
# SIGTERM graceful終了のself-pipe実装用 (WP-7)。依存グラフに既存。
libc = "0.2"
# 登録ルートのフォルダ監視 (MVP WP-2)。Linux: inotify backend。
notify = { workspace = true }
# ファイル操作のテンポラリ名採番 (WP-7)。workspace既存pin。
uuid = { workspace = true }
# 確認トークンの操作バインド用正準ダイジェスト (FG-WP7-2)。
# workspace既存pin (gento-imageと同一物。新規依存ではない)。
blake3 = { workspace = true }
# OSファイルマネージャーで表示・外部アプリで開く (MVP WP-4)。
# Rust API (reveal_item_in_dir / open_path) のみ使用し、JS側plugin commandは
# 叩かないため capability への権限追加は不要。
tauri-plugin-opener = "=2.5.4"

[dev-dependencies]

image = { workspace = true }

[features]
# Tauri CLIがrelease build時に有効化する。絶対に削除しないこと。
custom-protocol = ["tauri/custom-protocol"]
# 計測・検証専用機能 (dev bridge・障害注入・仮想カタログ) をrelease buildへ
# 入れるときに有効化する (WP-0)。debug buildではdebug_assertionsにより
# 常に含まれる。計測用release build:
#   cargo build --release -p gento-tauri --features custom-protocol,devtools
#   pnpm tauri build --no-bundle -- --features devtools   (CLIはcustom-protocolを自動付与)
# featureはworkspaceルートで一元管理する設計意图だが、cargoのfeatureは
# crate単位のため、伝播チェーン (gento-tauri → gento-core/gento-image/
# gento-ai) をここで宣言する。gento-aiはtestserver (mock) のコンパイル
# 隔離ゲートにdevtools featureを使う (FG-WP16-3 N5: devtools軸の
# `cargo test -p gento-tauri --features devtools` が通るように伝播)。
devtools = ["gento-core/devtools", "gento-image/devtools", "gento-ai/devtools"]
