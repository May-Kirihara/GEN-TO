[package]
name = "gento-tauri"
description = "GEN-TO spike desktop shell (thin Tauri adapter)"
version.workspace = true
edition.workspace = true

[lib]
name = "gento_tauri_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
gento-core = { workspace = true }
gento-image = { workspace = true }
serde = { workspace = true }
tauri = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
# SIGTERM graceful終了のself-pipe実装用 (WP-7)。依存グラフに既存。
libc = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
image = { workspace = true }

[features]
# Tauri CLIがrelease build時に有効化する。絶対に削除しないこと。
custom-protocol = ["tauri/custom-protocol"]
