[package]
name = "gento-embedding"
description = "GEN-TO local embedding runtime (ruri-v3 ONNX) and worker protocol"
version.workspace = true
edition.workspace = true

[lib]
name = "gento_embedding"
path = "src/lib.rs"

# 独立ワーカープロセス (docs/embedding-runtime.md §5)。tauriコアから
# spawnされ、stdio長さ前置JSONプロトコルで通信する。ホスト側
# (gento-tauri) はlibのプロトコル型を使用するためbinはlibに依存する。
[[bin]]
name = "gento-embedding-worker"
path = "src/bin/worker.rs"

[dependencies]
gento-core = { workspace = true }
# WP-17-1: 空き容量確認 (statvfs) のOS差実装の正本 (platform差隔離)
gento-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ort = { workspace = true }
tokenizers = { workspace = true }
ndarray = { workspace = true }
sha2 = { workspace = true }
# WP-12: USearch HNSW索引 (vector_index moduleのみで使用。nativeビルド要件は
# dependency-notes参照)
usearch = { workspace = true }
# WP-12: usearch束縛のcxx::Exception変換用 (lock既存の直依存化)
cxx = { workspace = true }
tracing = { workspace = true }
# モデルDL (進捗・キャンセル・Range再開・プロキシ環境変数尊重)。
# gento-aiと分離したClientインスタンスとして使用 (dependency-notes参照)。
reqwest = { workspace = true }
# DL前の空き容量確認はgento-platform (statvfs。WP-17-1集約)。
# workerバイナリのstderrログ (本体libでは未使用 → binのみ。cargoは
# bin/lib共通の[dependencies]しか持てないためlib側に余分にリンクされる
# が、workspace既存crateで新規導入なし)
tracing-subscriber = { workspace = true }

[dev-dependencies]
# WP-12ハイブリッド評価テスト: RRF融合 (通常依存はなし — devのみ。
# 依存方向 search→core で循環なし)
gento-search = { workspace = true }

[features]
# WP-0規約: 計測・検証専用機能のコンパイル隔離 (予約。現在使用なし)。
devtools = []
