[package]
name = "gento-image"
description = "GEN-TO image pipeline"
version.workspace = true
edition.workspace = true

[features]
# 計測・検証専用機能 (決定的エラー注入) を含める。
# debug build (debug_assertions) では常に有効扱いになるため、
# このfeatureはrelease buildでの明示的有効化 (--features devtools) 用。
devtools = []

[dependencies]
gento-core = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
png = { workspace = true }
image = { workspace = true }
webp = { workspace = true }
twox-hash = { workspace = true }
blake3 = { workspace = true }
