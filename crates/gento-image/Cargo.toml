[package]
name = "gento-image"
description = "GEN-TO image pipeline"
version.workspace = true
edition.workspace = true

[features]
# 計測・検証専用機能 (決定的エラー注入) を含める。
# debug build (debug_assertions) では常に有効扱いになるため、
# このfeatureはrelease buildでの明示的有効化 (--features devtools) 用。
devtools = []

[dependencies]
gento-core = { workspace = true }
# OS差の土台 (OSファイルID取得の正本はgento-platform。WP-7で集約移動)。
gento-platform = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
png = { workspace = true }
image = { workspace = true }
webp = { workspace = true }
kamadak-exif = { workspace = true }
twox-hash = { workspace = true }
blake3 = { workspace = true }
# WP-9: PNG zTXt/iTXt (compressed) のzlib解凍。png crateの既存利用により
# Cargo.lockに存在するcrateの直依存化 (新規crate導入ではない)。
flate2 = { workspace = true }
# WP-9: メタデータparser出力のraw JSON構築 (workspace既存pin)。
serde_json = { workspace = true }
