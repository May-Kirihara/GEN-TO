[package]
name = "gento-core"
description = "GEN-TO core domain types"
version.workspace = true
edition.workspace = true

[features]
# 計測・検証専用機能 (仮想5万件カタログ) を含める。
# debug build (debug_assertions) では常に有効扱いになるため、
# このfeatureはrelease buildでの明示的有効化 (--features devtools) 用。
devtools = []

[dependencies]
serde = { workspace = true }
# スマートコレクション条件JSON (query_json) の直列化・解析 (MVP WP-6)。
# workspace共有依存 (gento-db等と同pin) のため新規外部依存ではない。
serde_json = { workspace = true }
# タグ正規化名のNFC正規化 (WP-5。docs/dev/dependency-notes.md参照)。
# workspace共有ではなく単一crate依存として直付け。
unicode-normalization = "=0.1.25"

[dev-dependencies]
serde_json = { workspace = true }
