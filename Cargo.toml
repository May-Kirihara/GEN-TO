[workspace]
resolver = "2"
members = [
    "crates/gento-core",
    "crates/gento-image",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
gento-core = { path = "crates/gento-core" }
gento-image = { path = "crates/gento-image" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
walkdir = "=2.5.0"
png = "=0.18.1"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
