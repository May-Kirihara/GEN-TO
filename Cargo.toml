[workspace]
resolver = "2"
members = [
    "crates/gento-core",
    "crates/gento-db",
    "crates/gento-ai",
    "crates/gento-image",
    "crates/gento-platform",
    "crates/gento-search",
    "crates/gento-embedding",
    "apps/desktop/src-tauri",
]

# devtools feature (WP-0): 計測・検証専用機能のコンパイル隔離。
# cargoのfeatureはcrate単位のため、各memberの [features] で "devtools" を
# 定義し、バイナリ側 (gento-tauri) の devtools が gento-core/gento-image の
# 同名featureへ伝播する:
#   gento-tauri devtools = ["gento-core/devtools", "gento-image/devtools"]
# debug buildでは debug_assertions により常に有効扱い。releaseでは既定で
# 無効 (dev系commandはinvoke handlerに存在しない)。計測用release buildは
#   cargo build --release -p gento-tauri --features custom-protocol,devtools
# (custom-protocol はtauri CLIがrelease buildで自動付与するfeature。
#  cargo直接ビルドではfrontendDist埋め込みのために明示が必要)

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
gento-core = { path = "crates/gento-core" }
gento-ai = { path = "crates/gento-ai" }
gento-db = { path = "crates/gento-db" }
gento-image = { path = "crates/gento-image" }
gento-platform = { path = "crates/gento-platform" }
gento-search = { path = "crates/gento-search" }
gento-embedding = { path = "crates/gento-embedding" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
walkdir = "=2.5.0"
png = "=0.18.1"
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
    "webp",
    "avif-native",
] }
webp = { version = "=0.3.1", default-features = false }
kamadak-exif = "=0.5.5"
# WP-9: PNG zTXt/iTXt解凍 (png crate経由で既にlock内。直依存化のみ)。
flate2 = "=1.1.10"
twox-hash = "=2.1.4"
dirs = "=6.0.0"
rusqlite = { version = "=0.31.0", features = ["bundled", "backup"] }
uuid = { version = "=1.26.0", features = ["v7"] }
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
blake3 = "=1.8.7"
notify = "=8.2.0"
# WP-7: OSゴミ箱 (freedesktop Trash仕様。失敗時の通常削除フォールバック禁止)
trash = "=5.2.6"
# WP-10: OpenAI互換HTTPクライアント (rustls限定。opensslリンク回避はdependency-notes参照)
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "blocking"] }
# WP-10: APIキーのOS資格情報ストア (Linux=Secret Service via zbus。非可用時はファイルフォールバック)
keyring = "=4.2.0"
# WP-10: 画像data URL化 (reqwest推移依存と同一version。新規実体なし)
base64 = "=0.22.1"
# WP-11: ONNX Runtime束縛 (RC版リスク・binary取得方式はdependency-notes参照)
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-rustls",
] }
# WP-11: tokenizer.json直読み (fancy-regex = 純Rust regex engine。onigは
# Cリンクを避けるため不使用。tokenizers 0.23はregex featureが必須)
tokenizers = { version = "=0.23.1", default-features = false, features = [
    "fancy-regex",
] }
# WP-11: ort入力テンソル構築 (ortのndarray featureが要求する同一version帯)
ndarray = { version = "=0.17", default-features = false }
# WP-11: モデルパッケージsha256検証 (lock既存0.10.9の直依存化)
sha2 = "=0.10.9"
# WP-12: HNSW近傍探索索引 (Apache-2.0。cxx-buildでC++17をその場コンパイル
# + numkong静的リンク — ビルド要件はdependency-notes参照)
usearch = "=2.26.2"
# WP-12: usearchのRust束縛が返すcxx::Exceptionの直依存化 (lock既存1.0.199。
# エラー型変換のみに使用 — 新規実体なし)
cxx = "=1.0.199"
